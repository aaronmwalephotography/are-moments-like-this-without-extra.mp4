<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>see one Watch </title>
  <link rel="icon" href="https://videy.co/favicon.ico">

  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }

    /* ── Fullscreen Video Container ───────────────────────── */
    .player-wrap {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      position: relative;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    /* ── Play Overlay (Menggunakan <div> agar tidak muncul status bar URL) ── */
    .play-overlay {
      display: none;
      position: absolute;
      inset: 0;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.6);
      cursor: pointer;
      z-index: 10;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .play-overlay.show {
      display: flex;
    }

    .play-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(8px);
      transition: transform 0.2s, background 0.2s;
    }

    .play-btn:hover {
      transform: scale(1.1);
      background: rgba(255, 255, 255, 0.35);
    }

    .play-btn svg {
      margin-left: 4px;
    }
  </style>
</head>
<body>

  <div class="player-wrap">
    <video id="vid" controls playsinline preload="metadata">
      <source src="https://cdn2.videy.co/0D4o5dVH1.mp4" type="video/mp4">
    </video>
